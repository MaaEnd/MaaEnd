name: i18n-manual-translate

on:
  workflow_dispatch:
    inputs:
      target_ref:
        description: "要处理并回推的分支或提交（留空则使用当前触发 ref）"
        required: false
        type: string
        default: ""

permissions:
  contents: write

jobs:
  translate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          ref: ${{ inputs.target_ref != '' && inputs.target_ref || github.ref_name }}
          fetch-depth: 0

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Prepare llm.json from secret
        shell: bash
        run: |
          if [[ -z "${{ secrets.I18N_LLM_JSON }}" ]]; then
            echo "Missing secret: I18N_LLM_JSON" >&2
            exit 1
          fi
          cat > tools/i18n/llm.json <<'EOF'
          ${{ secrets.I18N_LLM_JSON }}
          EOF

      - name: Run i18n translation
        shell: bash
        run: |
          python tools/i18n/sync_locale_text.py TR --write --report "$RUNNER_TEMP/i18n-report.json"

      - name: Check changes
        id: changes
        shell: bash
        run: |
          if git diff --quiet; then
            echo "has_changes=false" >> "$GITHUB_OUTPUT"
          else
            echo "has_changes=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Commit and push
        if: steps.changes.outputs.has_changes == 'true'
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets/locales/interface assets/locales/go-service
          if git diff --cached --quiet; then
            echo "No locale changes to commit."
            exit 0
          fi
          git commit -m "chore: auto fill locale translations [skip ci]"
          git push origin HEAD:${{ inputs.target_ref != '' && inputs.target_ref || github.ref_name }}

      - name: Upload report artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: i18n-manual-translate-report
          path: ${{ runner.temp }}/i18n-report.json
