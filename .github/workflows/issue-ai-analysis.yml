name: Issue AI Analysis

on:
  issues:
    types: [opened]
  issue_comment:
    types: [created]
  workflow_dispatch:
    inputs:
      issue_number:
        description: 'Issue number to analyze'
        required: true
        type: number

jobs:
  copilot-analysis:
    if: |
      (github.event_name == 'issues' && github.event.action == 'opened') ||
      github.event_name == 'workflow_dispatch' ||
      (github.event_name == 'issue_comment' && 
       github.event.action == 'created' && 
       contains(github.event.comment.body, '@MaaEndBot') && 
       github.event.comment.user.type != 'Bot')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Copilot CLI
        run: npm install -g @github/copilot

      - name: Determine issue number
        id: issue_number
        run: |
          if [[ "${{ github.event_name }}" == "issues" ]] || [[ "${{ github.event_name }}" == "issue_comment" ]]; then
            echo "issue_number=${{ github.event.issue.number }}" | tee -a "$GITHUB_OUTPUT"
          elif [[ "${{ github.event_name }}" == "workflow_dispatch" ]]; then
            echo "issue_number=${{ github.event.inputs.issue_number }}" | tee -a "$GITHUB_OUTPUT"
          else
            echo "Unknown trigger" && exit 1
          fi

      - name: AI analysis
        shell: bash
        env:
          COPILOT_GITHUB_TOKEN: ${{ secrets.COPILOT_GITHUB_TOKEN }}
        run: |
          copilot -- model gpt-5-mini \
            --prompt "分析一下#${{ steps.issue_number.outputs.issue_number }}" \
            --allow-all --no-ask-user >> copilot_answer.md

      - name: Create Comment
        uses: peter-evans/create-or-update-comment@v1
        with:
          issue-number: ${{ steps.issue_number.outputs.issue_number }}
          body-path: copilot_answer.md
          token: ${{ secrets.GITHUB_TOKEN }}
