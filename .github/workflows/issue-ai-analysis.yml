name: AI Issue Analysis

on:
  issues:
    types: [opened]
  issue_comment:
    types: [created]
  workflow_dispatch:
    inputs:
      issue_number:
        description: 'Issue number to analyze'
        required: true
        type: number

jobs:
  ai-analysis:
    if: |
      (github.event_name == 'issues' && github.event.action == 'opened') ||
      github.event_name == 'workflow_dispatch' ||
      (github.event_name == 'issue_comment' &&
       github.event.action == 'created' &&
       contains(github.event.comment.body, '@MaaEndBot') &&
       github.event.comment.user.type != 'Bot')
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
    steps:
      - name: Install DMP analysis tools
        run: |
          curl -L --proto '=https' --tlsv1.2 -sSf https://raw.githubusercontent.com/cargo-bins/cargo-binstall/main/install-from-binstall-release.sh | bash
          cargo binstall -y minidump-stackwalk dump_syms

      - name: Generate MaaEndBot GitHub App token
        id: app-token
        uses: actions/create-github-app-token@v3
        with:
          client-id: ${{ vars.MAAEND_BOT_APP_CLIENT_ID }}
          private-key: ${{ secrets.MAAEND_BOT_APP_PRIVATE_KEY }}
          permission-issues: write

      # 分析质量仍依赖：.agents/skills/maaend-issue-log-analysis/SKILL.md
      - name: Analyze issue with AI
        id: analysis
        uses: MistEO/ai-issue-analysis@main
        with:
          agent: ${{ secrets.BOT_AI_AGENT }}
          api-key: ${{ secrets.BOT_AI_API_KEY }}
          api-base-url: ${{ secrets.BOT_AI_API_BASE_URL }}
          model: ${{ secrets.BOT_AI_MODEL }}
          github-token: ${{ steps.app-token.outputs.token }}
          bot-name: '@MaaEndBot'
          initial-comment-body: |
            🤖 **MaaEndBot 正在分析该 Issue...**

            感谢您的反馈！AI 正在自动分析该问题，预计耗时约 10 分钟。
          prompt-template: |
            先读取并严格执行 .agents/skills/maaend-issue-log-analysis/SKILL.md，分析 GitHub Issue {{issue_number}}。

            以下是任务完成的必要条件：
            1. 使用文件写入工具，将完整最终结论实际写入当前工作目录下的 {{answer_file}}。
            2. 写入后必须重新读取 {{answer_file}}，确认文件存在、非空且包含完整结论。
            3. 校验失败时必须继续修正，完成写入前不得结束任务。
            4. 仅在 stdout 或最终回复中输出 Markdown 不算完成。
            5. 不得仅声称“已经写入”，也不得要求调用方手动复制内容。

      - name: 查看完整输入输出
        if: always()
        env:
          ISSUE_NUMBER: ${{ steps.analysis.outputs.issue-number }}
          COMMENT_ID: ${{ steps.analysis.outputs.comment-id }}
          COMMENT_URL: ${{ steps.analysis.outputs.comment-url }}
        run: |
          echo "issue_number=$ISSUE_NUMBER"
          echo "comment_id=$COMMENT_ID"
          echo "comment_url=$COMMENT_URL"
          echo "(Full agent-output and final-conclusion are available in the uploaded artifacts)"
