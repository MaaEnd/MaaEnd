name: issue auto label

on:
  issues:
    types: [opened]

jobs:
  auto-label:
    runs-on: ubuntu-latest
    permissions:
      issues: write
    steps:
      - name: Label team member issues
        uses: actions/github-script@v7
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          script: |
            const issue = context.payload.issue;
            const association = issue.author_association;

            console.log(
              `Issue #${issue.number} author_association: ${association}`
            );

            if (association === 'OWNER' || association === 'MEMBER') {
              await github.rest.issues.addLabels({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: issue.number,
                labels: ['MaaEnd Team'],
              });

              console.log(
                `Added MaaEnd Team label to issue #${issue.number} (author: ${association})`
              );
            } else {
              console.log(
                `Skipping MaaEnd Team label for issue #${issue.number} (author: ${association})`
              );
            }

      - name: Match task labels by issue content
        uses: actions/github-script@v7
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          script: |
            // 1) 组装用于匹配的 issue 文本（标题 + 正文）
            const issue = context.payload.issue;
            const title = issue.title || '';
            const body = issue.body || '';
            const issueText = `${title}\n${body}`.toLowerCase();

            // 2) 拉取仓库全部 label（自动分页）
            const allLabels = await github.paginate(
              github.rest.issues.listLabelsForRepo,
              {
                owner: context.repo.owner,
                repo: context.repo.repo,
                per_page: 100,
              }
            );

            const matchedLabels = [];

            // 3) 只处理形如 "task: xxxx" 的标签，并提取关键词 xxxx
            for (const label of allLabels) {
              const name = label.name || '';
              const match = name.match(/^task:\s*(.+)$/i);
              if (!match) {
                continue;
              }

              const keyword = (match[1] || '').trim();
              if (!keyword) {
                continue;
              }

              // 4) 用关键词与 issue 文本做子串匹配，命中则记录原标签名
              if (issueText.includes(keyword.toLowerCase())) {
                matchedLabels.push(name);
              }
            }

            // 5) 无命中则结束，不做写操作
            if (matchedLabels.length === 0) {
              console.log('No task label matched.');
              return;
            }

            // 6) 一次性把所有命中的 task 标签加到当前 issue
            await github.rest.issues.addLabels({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: issue.number,
              labels: matchedLabels,
            });

            console.log(
              `Added labels to issue #${issue.number}: ${matchedLabels.join(', ')}`
            );

      - name: Label client type from issue form
        uses: actions/github-script@v7
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          script: |
            const CLIENT_COLORS = {
              'client: MXU': 'e36209',
              'client: MaaFwApp': 'cd6fbe',
            };

            const clientLabelOf = (body) => {
              // issue 表单渲染出的固定格式：`### 客户端类型` 标题，空行，再一行答案。
              // 用行首 ### 锚定，避免正文里引用同一标题时误命中。
              const match = (body || '').match(/^###[ \t]*客户端类型[ \t]*\r?\n+([^\r\n]+)/m);
              if (!match) {
                return null;
              }

              // 按关键词匹配而非完整选项文案，模板文案微调后依然可用。
              const answer = match[1].trim().toLowerCase();
              if (answer.includes('maafwapp')) {
                return 'client: MaaFwApp';
              }
              if (answer.includes('mxu')) {
                return 'client: MXU';
              }
              return null;
            };

            const issue = context.payload.issue;
            const target = clientLabelOf(issue.body);
            if (!target) {
              console.log(`Issue #${issue.number} 未识别到客户端类型，跳过`);
              return;
            }

            const owner = context.repo.owner;
            const repo = context.repo.repo;
            const current = (issue.labels || []).map((label) =>
              typeof label === 'string' ? label : label.name
            );
            if (current.includes(target)) {
              console.log(`Issue #${issue.number} 已有 ${target}，跳过`);
              return;
            }

            // 标签被删除后自动补建，否则 addLabels 会直接 422。
            try {
              await github.rest.issues.getLabel({ owner, repo, name: target });
            } catch (error) {
              if (error.status !== 404) {
                throw error;
              }
              console.log(`标签 ${target} 不存在，创建`);
              await github.rest.issues.createLabel({
                owner,
                repo,
                name: target,
                color: CLIENT_COLORS[target],
              });
            }

            await github.rest.issues.addLabels({
              owner,
              repo,
              issue_number: issue.number,
              labels: [target],
            });

            console.log(`Issue #${issue.number} 打上 ${target}`);
