name: Test pipeline data cache

on:
    push:
        branches:
            - "v2"
        paths:
            - ".github/workflows/test-data-cache.yml"
            - "tools/pipeline-generate/fetch-data.mjs"
            - "tools/pipeline-generate/fetch-data.test.mjs"
            - "tools/pipeline-generate/utils/paths.mjs"
    pull_request:
        paths:
            - ".github/workflows/test-data-cache.yml"
            - "tools/pipeline-generate/fetch-data.mjs"
            - "tools/pipeline-generate/fetch-data.test.mjs"
            - "tools/pipeline-generate/utils/paths.mjs"
    workflow_dispatch:

jobs:
    cache:
        strategy:
            matrix:
                os: [ubuntu-latest, windows-latest]
        runs-on: ${{ matrix.os }}
        steps:
            - uses: actions/checkout@v6
            - uses: actions/setup-node@v6
              with:
                  node-version: 22
            - name: Test download and cache failure recovery
              run: node --test tools/pipeline-generate/fetch-data.test.mjs
