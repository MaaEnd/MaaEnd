name: Blame Ignore Update

on:
  workflow_dispatch:
  schedule:
    - cron: "45 22 * * *" # UTC+8 06:45

jobs:
  blame-ignore:
    name: Update Git Blame Ignore Revs
    if: ${{ github.repository_owner == 'MaaEnd' }}
    runs-on: ubuntu-latest
    steps:
      - name: Generate MaaEndBot GitHub App token
        id: app-token
        uses: actions/create-github-app-token@v3
        with:
          client-id: ${{ vars.MAAEND_BOT_APP_CLIENT_ID }}
          private-key: ${{ secrets.MAAEND_BOT_APP_PRIVATE_KEY }}
          permission-contents: write

      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          token: ${{ steps.app-token.outputs.token }}
          fetch-depth: 0
          show-progress: false

      - name: Collect blame ignore revs
        id: collect
        run: |
          set -euo pipefail

          # .last-blame-ignore-commit 记录上次收录时的 HEAD；首次运行没有该文件，扫描全部历史
          if [ -f .github/.last-blame-ignore-commit ]; then
            range="$(cat .github/.last-blame-ignore-commit)..HEAD"
          else
            range=HEAD
          fi

          new_revs="$(git log --reverse --format=%H --grep='\[blame ignore\]' "$range")"
          if [ -z "$new_revs" ]; then
            echo "No new [blame ignore] commits in $range"
            echo "has_changes=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          echo "$new_revs" | tee -a .git-blame-ignore-revs
          git rev-parse HEAD > .github/.last-blame-ignore-commit
          echo "has_changes=true" >> "$GITHUB_OUTPUT"

      - name: Commit and push changes
        if: steps.collect.outputs.has_changes == 'true'
        uses: actions-js/push@master
        with:
          author_name: "maaendbotapp[bot]"
          author_email: "305547419+maaendbotapp[bot]@users.noreply.github.com"
          rebase: true
          branch: ${{ github.ref }}
          message: "chore: auto update git blame ignore revs

            https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}

            [skip changelog]"
          github_token: ${{ steps.app-token.outputs.token }}
