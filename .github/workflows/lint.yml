name: lint

on:
  push:
    branches:
      - "v2"
    paths:
      - "**/*.py"
      - ".github/workflows/lint.yml"
      - ".python-version"
      - "pyproject.toml"
      - "uv.lock"

  pull_request:
    branches:
      - "**"
    paths:
      - "**/*.py"
      - ".github/workflows/lint.yml"
      - ".python-version"
      - "pyproject.toml"
      - "uv.lock"

  workflow_dispatch:

# 同一 PR / 分支再次推送时取消上一次运行，旧提交的验证不必跑完
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  ruff:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - uses: astral-sh/setup-uv@v10.3.0
        with:
          enable-cache: true
          cache-python: true

      - name: Run ruff
        run: uv run ruff check .
