name: check

on:
  workflow_call:
    inputs:
      checkout_repository:
        required: false
        type: string
        default: ""
      checkout_ref:
        required: false
        type: string
        default: ""
  workflow_dispatch:
    inputs:
      checkout_repository:
        description: "可选，指定 checkout 的仓库"
        required: false
        type: string
        default: ""
      checkout_ref:
        description: "可选，指定 checkout 的分支、标签或提交"
        required: false
        type: string
        default: ""

jobs:
  resource:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          repository: ${{ inputs.checkout_repository != '' && inputs.checkout_repository || github.repository }}
          ref: ${{ inputs.checkout_ref != '' && inputs.checkout_ref || github.ref }}
          fetch-depth: 0

      - uses: pnpm/action-setup@v4

      - name: Use Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'pnpm'

      - name: Run maa-checker
        run: |
          pnpm i
          pnpm run check

      - name: Validate JSON Schema
        run: |
          python -m pip install jsonschema==4.26.0 referencing==0.37.0
          python tools/validate_schema.py --resource-dirs assets/resource --exclude-dirs assets/resource/gamedata assets/resource/image --task-dirs assets/tasks
