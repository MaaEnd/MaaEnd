name: check

on:
  push:
    branches:
      - "v2"
    paths:
      - ".github/workflows/check.yml"
      - "assets/**"
      - "!assets/resource/model"
      - "tools/schema/**"
      - "package.json"
      - "maatools.config.mts"
      - "pyproject.toml"
      - "uv.lock"

  pull_request:
    branches:
      - "**"
    paths:
      - ".github/workflows/check.yml"
      - "assets/**"
      - "!assets/resource/model"
      - "tools/schema/**"
      - "package.json"
      - "maatools.config.mts"
      - "pyproject.toml"
      - "uv.lock"

  workflow_dispatch:

jobs:
  resource:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - uses: pnpm/action-setup@v6

      - uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: "pnpm"

      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - uses: astral-sh/setup-uv@v9.0.0
        with:
          enable-cache: true

      # MaaFW 5.13+ Linux 包链接 PipeWire；ubuntu-latest 默认未安装
      - name: Install MaaFW Linux runtime libraries
        run: |
          sudo apt-get update -y
          sudo apt-get install -y libpipewire-0.3-0 libdbus-1-3

      - name: Run maa-checker
        run: |
          pnpm i
          pnpm run check

      - name: Validate JSON Schema
        run: uv run --frozen --only-group schema tools/validate_schema.py --resource-dirs assets/resource --exclude-dirs assets/resource/gamedata assets/resource/image assets/resource/model --task-dirs assets/tasks
