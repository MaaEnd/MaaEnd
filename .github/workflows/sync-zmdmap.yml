name: Sync ZmdMap Data

on:
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write

jobs:
  sync-pipeline-generate:
    runs-on: ubuntu-latest
    steps:
      - name: Generate MaaEndBot GitHub App token
        id: app-token
        uses: actions/create-github-app-token@v3
        with:
          client-id: ${{ vars.MAAEND_BOT_APP_CLIENT_ID }}
          private-key: ${{ secrets.MAAEND_BOT_APP_PRIVATE_KEY }}
          permission-contents: write
          permission-pull-requests: write

      - name: Checkout repository
        uses: actions/checkout@v6
        with:
          token: ${{ steps.app-token.outputs.token }}
          ref: ${{ github.event.repository.default_branch }}

      - uses: pnpm/action-setup@v6

      - name: Setup Node
        uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: "pnpm"

      - name: Install dependencies
        run: |
          pnpm install --frozen-lockfile

      - name: Generate pipeline data
        run: |
          pnpm generate:AutoDelivery
          pnpm generate:DeliveryJobs
          pnpm generate:EnvironmentMonitoring
          pnpm generate:OutpostTrading

      - name: Get version info
        id: version
        run: |
          echo "version=$(cat tools/pipeline-generate/data/version.txt)" >> "$GITHUB_OUTPUT"

      - name: Create Pull Request
        uses: peter-evans/create-pull-request@v8
        with:
          token: ${{ steps.app-token.outputs.token }}
          committer: "maaendbotapp[bot] <305547419+maaendbotapp[bot]@users.noreply.github.com>"
          author: "maaendbotapp[bot] <305547419+maaendbotapp[bot]@users.noreply.github.com>"
          add-paths: |
            tools/pipeline-generate
            assets
          commit-message: "chore: sync zmdmap pipeline data ${{ steps.version.outputs.version }}"
          branch: chore/sync-zmdmap-pipeline-data
          title: "chore: sync zmdmap pipeline data ${{ steps.version.outputs.version }}"
          body: |
            ## Summary

            This PR automatically synchronized zmdmap data used by pipeline-generate and regenerated dependent artifacts.

            Please review the changes before merging it.

            **Generated Tasks:**
            - AutoDelivery
            - DeliveryJobs
            - EnvironmentMonitoring
            - OutpostTrading

            **Version Information:**
            - Version: ${{ steps.version.outputs.version }}

  sync-essence-filter:
    runs-on: ubuntu-latest
    steps:
      - name: Generate MaaEndBot GitHub App token
        id: app-token
        uses: actions/create-github-app-token@v3
        with:
          client-id: ${{ vars.MAAEND_BOT_APP_CLIENT_ID }}
          private-key: ${{ secrets.MAAEND_BOT_APP_PRIVATE_KEY }}
          permission-contents: write
          permission-pull-requests: write

      - name: Checkout repository
        uses: actions/checkout@v6
        with:
          token: ${{ steps.app-token.outputs.token }}
          ref: ${{ github.event.repository.default_branch }}

      - name: Setup Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: python3 -m pip install json5

      - name: Sync EssenceFilter source data
        id: sync
        run: python3 -u tools/essence_filter/sync_zmdmap.py

      - name: Generate EssenceFilter data
        if: steps.sync.outputs.updated == 'true'
        env:
          DATA_VERSION: ${{ steps.sync.outputs.data_version }}
        run: |
          python3 -u tools/essence_filter/extract_skill_pools.py
          python3 -u tools/essence_filter/build_locations.py --data-version "$DATA_VERSION"
          python3 -u tools/essence_filter/build_autoessence_tasks.py

      - name: Create Pull Request
        if: steps.sync.outputs.updated == 'true'
        uses: peter-evans/create-pull-request@v8
        with:
          token: ${{ steps.app-token.outputs.token }}
          committer: "maaendbotapp[bot] <305547419+maaendbotapp[bot]@users.noreply.github.com>"
          author: "maaendbotapp[bot] <305547419+maaendbotapp[bot]@users.noreply.github.com>"
          add-paths: |
            assets/data/EssenceFilter/energy_point_gems.json
            assets/data/EssenceFilter/weapons_output.json
            assets/data/EssenceFilter/skill_pools.json
            assets/data/EssenceFilter/locations.json
            assets/data/EssenceFilter/matcher_config.json
            assets/tasks/AutoEssence/AutoEssence.json
            assets/tasks/AutoEssence/Location/
            assets/tasks/AutoEssence/Target/Target.json
            assets/interface.json
            assets/resource/pipeline/AutoEssence/CommonNodes/AutoEssence.json
            assets/locales/interface/zh_cn.json
            assets/locales/interface/zh_tw.json
            assets/locales/interface/en_us.json
            assets/locales/interface/ja_jp.json
            assets/locales/interface/ko_kr.json
          commit-message: "chore(essencefilter): sync zmdmap data"
          branch: chore/sync-zmdmap-essence-filter-data
          title: "chore(essencefilter): sync zmdmap data"
          body: |
            ## Summary

            This PR synchronized the latest valid EssenceFilter data from zmdmap and regenerated dependent data files and AutoEssence task options.

            Please review the changes before merging it.
