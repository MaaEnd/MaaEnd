name: Sync ZmdMap Data

on:
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write

jobs:
  sync-pipeline-generate:
    runs-on: ubuntu-latest
    env:
      # 下载与生成的进度实时进日志，不要等进程退出才刷出来。
      PYTHONUNBUFFERED: "1"
    steps:
      - name: Generate MaaEndBot GitHub App token
        id: app-token
        uses: actions/create-github-app-token@v3
        with:
          client-id: ${{ vars.MAAEND_BOT_APP_CLIENT_ID }}
          private-key: ${{ secrets.MAAEND_BOT_APP_PRIVATE_KEY }}
          permission-contents: write
          permission-pull-requests: write

      - name: Checkout repository
        uses: actions/checkout@v6
        with:
          token: ${{ steps.app-token.outputs.token }}
          ref: ${{ github.event.repository.default_branch }}

      - uses: pnpm/action-setup@v6

      - name: Setup Node
        uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: "pnpm"

      # setup-uv 一并负责 Python：uv 按 requires-python 自动准备解释器，不必再挂 actions/setup-python。
      - uses: astral-sh/setup-uv@v10.3.0
        with:
          enable-cache: true
          cache-python: true

      - name: Install dependencies
        run: |
          pnpm install --frozen-lockfile

      # 不必先整包下载：下面的 generate 脚本各自只 fetch 自己用得到的那几份数据。
      # generate:DeliveryJobs 的第一条就是 generate:AutoDelivery，不必再单独跑一遍。
      - name: Generate pipeline data
        run: |
          pnpm generate:DeliveryJobs
          pnpm generate:EnvironmentMonitoring
          pnpm generate:OutpostTrading
          pnpm generate:AutoStockStaple
          pnpm generate:GiftOperator
          pnpm generate:SceneTeleport
          pnpm generate:AutoEssence

      - name: Get version info
        id: version
        run: |
          # 版本写在每份数据的最前面（version 字段），不再有单独的 version.txt。
          echo "version=$(jq -r .version tools/zmdmap/data/delivery_destinations.json)" >> "$GITHUB_OUTPUT"

      - name: Create Pull Request
        uses: peter-evans/create-pull-request@v8
        with:
          token: ${{ steps.app-token.outputs.token }}
          committer: "maaendbotapp[bot] <305547419+maaendbotapp[bot]@users.noreply.github.com>"
          author: "maaendbotapp[bot] <305547419+maaendbotapp[bot]@users.noreply.github.com>"
          add-paths: |
            tools/zmdmap
            tools/pipeline-generate
            assets
          commit-message: "chore: sync zmdmap pipeline data ${{ steps.version.outputs.version }}"
          branch: chore/sync-zmdmap-pipeline-data
          title: "chore: sync zmdmap pipeline data ${{ steps.version.outputs.version }}"
          body: |
            ## Summary

            This PR automatically synchronized zmdmap data used by pipeline-generate and regenerated dependent artifacts.

            Please review the changes before merging it.

            **Generated Tasks:**
            - AutoDelivery
            - DeliveryJobs
            - EnvironmentMonitoring
            - OutpostTrading
            - AutoStockStaple
            - GiftOperator
            - SceneTeleport
            - AutoEssence

            **Version Information:**
            - Version: ${{ steps.version.outputs.version }}

  sync-seize-delivery-jobs:
    runs-on: ubuntu-latest
    env:
      PYTHONUNBUFFERED: "1"
    steps:
      - name: Generate MaaEndBot GitHub App token
        id: app-token
        uses: actions/create-github-app-token@v3
        with:
          client-id: ${{ vars.MAAEND_BOT_APP_CLIENT_ID }}
          private-key: ${{ secrets.MAAEND_BOT_APP_PRIVATE_KEY }}
          permission-contents: write
          permission-pull-requests: write

      - name: Checkout repository
        uses: actions/checkout@v6
        with:
          token: ${{ steps.app-token.outputs.token }}
          ref: ${{ github.event.repository.default_branch }}

      - uses: pnpm/action-setup@v6

      - name: Setup Node
        uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: "pnpm"

      - uses: astral-sh/setup-uv@v10.3.0
        with:
          enable-cache: true
          cache-python: true

      - name: Install dependencies
        run: |
          pnpm install --frozen-lockfile

      # 这个任务生成器复用 AutoDelivery 的模型与文案，脚本自己只 fetch delivery_destinations 那一份数据。
      - name: Generate pipeline data
        run: |
          pnpm generate:SeizeDeliveryJobs

      - name: Get version info
        id: version
        run: |
          echo "version=$(jq -r .version tools/zmdmap/data/delivery_destinations.json)" >> "$GITHUB_OUTPUT"

      - name: Create Pull Request
        uses: peter-evans/create-pull-request@v8
        with:
          token: ${{ steps.app-token.outputs.token }}
          committer: "maaendbotapp[bot] <305547419+maaendbotapp[bot]@users.noreply.github.com>"
          author: "maaendbotapp[bot] <305547419+maaendbotapp[bot]@users.noreply.github.com>"
          add-paths: |
            tools/zmdmap
            tools/pipeline-generate
            assets
          commit-message: "chore: sync zmdmap seize delivery jobs data ${{ steps.version.outputs.version }}"
          branch: chore/sync-zmdmap-seize-delivery-jobs
          title: "chore: sync zmdmap seize delivery jobs data ${{ steps.version.outputs.version }}"
          body: |
            ## Summary

            This PR automatically synchronized zmdmap data used by the SeizeDeliveryJobs generator and regenerated its pipeline and task artifacts.

            Please review the changes before merging it.

            **Generated Tasks:**
            - SeizeDeliveryJobs

            **Version Information:**
            - Version: ${{ steps.version.outputs.version }}

  sync-essence-filter:
    runs-on: ubuntu-latest
    env:
      PYTHONUNBUFFERED: "1"
    steps:
      - name: Generate MaaEndBot GitHub App token
        id: app-token
        uses: actions/create-github-app-token@v3
        with:
          client-id: ${{ vars.MAAEND_BOT_APP_CLIENT_ID }}
          private-key: ${{ secrets.MAAEND_BOT_APP_PRIVATE_KEY }}
          permission-contents: write
          permission-pull-requests: write

      - name: Checkout repository
        uses: actions/checkout@v6
        with:
          token: ${{ steps.app-token.outputs.token }}
          ref: ${{ github.event.repository.default_branch }}

      # setup-uv 一并负责 Python：uv 按 requires-python 自动准备解释器，不必再挂 actions/setup-python。
      - uses: astral-sh/setup-uv@v10.3.0
        with:
          enable-cache: true
          cache-python: true

      - name: Fetch zmdmap data
        run: uv run zmdmap fetch --only weapons --only energy_point_gems

      # AutoEssence 的武器选项会把图标写成 resource/image/UI/Item/<武器id>.png，并在生成时检查文件在不在；
      # 图标没发布就整份生成报错（2026-11-21 那次就是缺 wpn_pistol_0013 等的图标失败的）。先查一遍，缺了就
      # 只跳过任务生成：EssenceFilter 的数据照常更新、PR 照常提，等图标合进来下次补上。
      - name: Check weapon UI icons
        id: weapon-icons
        run: |
          python3 - > /tmp/weapon-ui-icons.txt <<'PY'
          import json
          import pathlib

          weapons = json.load(open("tools/zmdmap/data/weapons.json", encoding="utf-8"))
          weapon_types = {"Sword", "Claymores", "Pistol", "Wand", "Lance"}
          ui_dir = pathlib.Path("assets/resource/image/UI/Item")
          missing = [
              weapon_id
              for weapon_id, weapon in weapons.items()
              if isinstance(weapon, dict)
              and isinstance(weapon.get("rarity"), int)
              and weapon["rarity"] >= 5
              and weapon.get("weapon_type") in weapon_types
              and not (ui_dir / f"{weapon_id}.png").is_file()
          ]
          print(len(missing))
          print(", ".join(missing))
          PY
          missing=$(sed -n 1p /tmp/weapon-ui-icons.txt)
          ids=$(sed -n 2p /tmp/weapon-ui-icons.txt)
          echo "missing=$missing" >> "$GITHUB_OUTPUT"
          if [ "$missing" != "0" ]; then
            echo "::warning::$missing 把五星及以上武器的 UI 图标还没发布（$ids），本次跳过 AutoEssence 任务生成，等图标齐了再跑"
          fi

      # 依赖都在 pyproject 的默认组里，uv 按 uv.lock 建好环境即可，不必单独装 python 或 pip install。
      - name: Generate EssenceFilter data
        run: |
          uv run python -u tools/essence_filter/sync_zmdmap.py
          uv run python -u tools/essence_filter/extract_skill_pools.py
          uv run python -u tools/essence_filter/build_locations.py

      - name: Generate AutoEssence task
        if: steps.weapon-icons.outputs.missing == '0'
        run: uv run python -u tools/essence_filter/build_autoessence_tasks.py

      - name: Create Pull Request
        uses: peter-evans/create-pull-request@v8
        with:
          token: ${{ steps.app-token.outputs.token }}
          committer: "maaendbotapp[bot] <305547419+maaendbotapp[bot]@users.noreply.github.com>"
          author: "maaendbotapp[bot] <305547419+maaendbotapp[bot]@users.noreply.github.com>"
          add-paths: |
            tools/zmdmap
            assets/data/EssenceFilter
            assets/tasks/AutoEssence
            assets/interface.json
            assets/resource/pipeline/AutoEssence
            assets/locales/interface
          commit-message: "chore(essencefilter): sync zmdmap data"
          branch: chore/sync-zmdmap-essence-filter-data
          title: "chore(essencefilter): sync zmdmap data"
          body: |
            ## Summary

            This PR synchronized the latest EssenceFilter compact game data from zmdmap and regenerated dependent data files and AutoEssence task options.

            Please review the changes before merging it.

  sync-icon-recognition:
    runs-on: ubuntu-latest
    env:
      PYTHONUNBUFFERED: "1"
    steps:
      - name: Generate MaaEndBot GitHub App token
        id: app-token
        uses: actions/create-github-app-token@v3
        with:
          client-id: ${{ vars.MAAEND_BOT_APP_CLIENT_ID }}
          private-key: ${{ secrets.MAAEND_BOT_APP_PRIVATE_KEY }}
          permission-contents: write
          permission-pull-requests: write

      - name: Checkout repository
        uses: actions/checkout@v6
        with:
          token: ${{ steps.app-token.outputs.token }}
          ref: ${{ github.event.repository.default_branch }}

      # setup-uv 一并负责 Python：uv 按 requires-python 自动准备解释器，不必再挂 actions/setup-python。
      - uses: astral-sh/setup-uv@v10.3.0
        with:
          enable-cache: true
          cache-python: true

      - name: Fetch zmdmap data
        run: uv run zmdmap fetch --only item_mini_table --only weapons

      # json5（读物品表）与 pillow（合成 UI 图标）都在默认组里，httpx 是核心依赖。
      - name: Download icon resources
        run: uv run tools/icon_recognition/download.py --workers 16

      - name: Publish icon resources
        run: uv run tools/icon_recognition/publish.py

      # StashBackpack 的可选项来自 usable_items，战术物品还要按 IconRecognition 的目录排序与查图标，
      # 所以放在图标生成之后跑：这一步用的就是刚下载、刚合成的图标，不必等图标那个 PR 先合并。
      - name: Fetch usable items data
        run: uv run zmdmap fetch --only usable_items

      - uses: pnpm/action-setup@v6

      - name: Setup Node
        uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: "pnpm"

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      # 上游有时只发布了数据、还没发布这一批的图标（下载那一步遇到 404 只是跳过，不算失败）。
      # 这时不生成 StashBackpack：任务会引用没有图标的物品，宁可按原样留着，等图标齐了再跑一次。
      - name: Check tactical item icons
        id: tactical-icons
        run: |
          missing=$(python3 -c 'import json; items = json.load(open("tools/zmdmap/data/item_mini_table.json", encoding="utf-8")); catalog = json.load(open("assets/data/IconRecognition/recognition_items.json", encoding="utf-8")); print(sum(1 for item_id, item in items.items() if isinstance(item, dict) and item.get("storageKind") == "Normal" and item.get("categoryType") == "Usable" and item.get("type") == "TacticalItem" and item_id not in catalog))'
          )
          echo "missing=$missing" >> "$GITHUB_OUTPUT"
          if [ "$missing" != "0" ]; then
            echo "::warning::$missing 个战术物品的图标上游还没发布，本次跳过 StashBackpack 生成，等图标齐了再跑"
          fi

      - name: Generate StashBackpack task
        if: steps.tactical-icons.outputs.missing == '0'
        run: pnpm generate:StashBackpack

      - name: Create Pull Request
        uses: peter-evans/create-pull-request@v8
        with:
          token: ${{ steps.app-token.outputs.token }}
          committer: "maaendbotapp[bot] <305547419+maaendbotapp[bot]@users.noreply.github.com>"
          author: "maaendbotapp[bot] <305547419+maaendbotapp[bot]@users.noreply.github.com>"
          add-paths: |
            tools/zmdmap
            assets/data/IconRecognition
            assets/resource/image/IconRecognition
            assets/resource/image/UI/Item
            assets/locales/interface
            assets/tasks/StashBackpack.json
            assets/resource/pipeline/StashBackpack
          commit-message: "chore(iconrecognition): sync zmdmap icon resources and StashBackpack task"
          branch: chore/sync-zmdmap-icon-recognition
          title: "chore(iconrecognition): sync zmdmap icon resources and StashBackpack task"
          body: |
            ## Summary

            This PR automatically downloaded the latest IconRecognition icons from zmdmap and regenerated the recognition catalog, item images, and localized item names. The StashBackpack task is regenerated in the same run, right after the icons, so its items and icon ordering match this batch.

            Please review the changes before merging it.

            **Generated Artifacts:**
            - `assets/data/IconRecognition/recognition_items.json`
            - `assets/resource/image/IconRecognition/`
            - `assets/resource/image/UI/Item/`
            - `assets/locales/interface/` item names
            - `assets/tasks/StashBackpack.json` and `assets/resource/pipeline/StashBackpack/`
