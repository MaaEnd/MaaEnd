name: Test pipeline merge

on:
    push:
        branches:
            - "v2"
        paths:
            - ".github/workflows/test-merge-pipeline.yml"
            - "tools/merge_pipeline.py"
            - "tools/test_merge_pipeline.py"
            - "tools/setup/path_utils.py"

    pull_request:
        paths:
            - ".github/workflows/test-merge-pipeline.yml"
            - "tools/merge_pipeline.py"
            - "tools/test_merge_pipeline.py"
            - "tools/setup/path_utils.py"

    workflow_dispatch:

jobs:
    merge-pipeline:
        strategy:
            matrix:
                os:
                    - ubuntu-latest
                    - windows-latest
                python:
                    - "3.10"
                    - "3.12"
        runs-on: ${{ matrix.os }}
        steps:
            - uses: actions/checkout@v6

            - uses: actions/setup-python@v6
              with:
                  python-version: ${{ matrix.python }}

            - name: Install JSON5 parser
              run: python -m pip install json5==0.15.0

            - name: Test pipeline merge safety
              env:
                  PYTHONIOENCODING: utf-8
              run: python -m unittest discover -s tools -p test_merge_pipeline.py -v
