name: Test pipeline merge

on:
  push:
    branches:
      - "v2"
    paths:
      - ".github/workflows/test-merge-pipeline.yml"
      - "tools/merge_pipeline.py"
      - "tools/test_merge_pipeline.py"
      - "tools/setup/path_utils.py"

  pull_request:
    paths:
      - ".github/workflows/test-merge-pipeline.yml"
      - "tools/merge_pipeline.py"
      - "tools/test_merge_pipeline.py"
      - "tools/setup/path_utils.py"

  workflow_dispatch:

permissions:
  contents: read

jobs:
  merge-pipeline:
    strategy:
      matrix:
        os:
          - ubuntu-latest
          - windows-latest
        python:
          - "3.10"
          - "3.12"
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python }}

      - name: Install JSON5 parser
        run: python -m pip install json5==0.15.0

      - name: Test pipeline merge safety (no skipped cases)
        env:
          PYTHONIOENCODING: utf-8
        run: >
          python -c "import sys, unittest;
          suite = unittest.defaultTestLoader.discover('tools', pattern='test_merge_pipeline.py');
          result = unittest.TextTestRunner(verbosity=2).run(suite);
          sys.exit(0 if result.testsRun > 0 and result.wasSuccessful() and not result.skipped else 1)"
