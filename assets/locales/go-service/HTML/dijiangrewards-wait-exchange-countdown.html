<div
    class="dijiangrewards-wait-exchange-countdown"
    style="
        background: #ffffff;
        color: #222222;
        padding: 8px 12px;
        border-radius: 8px;
        border: 1px solid #d8ecff;
        max-width: 400px;
    ">
    <style>
        *:has(.dijiangrewards-wait-exchange-countdown):has(~ * .dijiangrewards-wait-exchange-countdown) {
            display: none !important;
        }
        /* MXU 在每条日志后渲染一条分隔线（空 div + aria-hidden），
           隐藏紧跟在过期条目之后、下一条即更新倒计时的分隔线 */
        div[aria-hidden="true"]:not(:has(*)):has(+ div .dijiangrewards-wait-exchange-countdown) {
            display: none !important;
        }
    </style>
    <div style="font-size: 0.95em; color: #1f5f99; font-weight: 600">{{t "message"}}</div>
    <div style="font-size: 1.2em; font-weight: 600; color: #1f5f99; font-family: monospace">{{.Formatted}}</div>
</div>
