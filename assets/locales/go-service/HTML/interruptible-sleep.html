<div
    class="autoecofarm-interruptible-sleep"
    style="
        background: #ffffff;
        color: #222222;
        padding: 8px 12px;
        border-radius: 8px;
        border: 1px solid #e8f5e9;
        max-width: 400px;
    ">
    <style>
        *:has(.autoecofarm-interruptible-sleep):has(~ * .autoecofarm-interruptible-sleep),
        *:has(.autoecofarm-interruptible-sleep):has(~ * .autoecofarm-interruptible-sleep-done) {
            display: none !important;
        }
        /* MXU 在每条日志后渲染一条分隔线（空 div + aria-hidden），
           以「过期条目 + 其后紧邻分隔线」为锚点隐藏，普通日志后的分隔线不受影响，
           倒计时与下次更新之间插入普通日志时也能正确隐藏 */
        div:has(.autoecofarm-interruptible-sleep):has(
                ~ * :is(.autoecofarm-interruptible-sleep, .autoecofarm-interruptible-sleep-done)
            )
            + div[aria-hidden="true"]:not(:has(*)) {
            display: none !important;
        }
    </style>
    <div style="font-size: 1.2em; font-weight: 600; color: #2b7d2b; font-family: monospace">{{.Formatted}}</div>
</div>
