<span style="color: #ff9800; font-size: 1.6em; font-weight: 900;">⚠️ 警告：HDR または「アプリの色を自動的に管理する」が有効です</span>
<br/><span style="color: #faad14; font-size: 1.3em; font-weight: bold;">🖥️ HDR または自動色管理によりスクリーンショットの色が異なり、認識精度に影響する場合があります</span>
<br/><span style="font-size: 1.2em; font-weight: bold;">💡 推奨：</span>
<br/><span style="color: #00bfff; font-size: 1.2em;">  • Windows の設定 → システム → ディスプレイ → 「HDR」をオフにする</span>
<br/><span style="color: #00bfff; font-size: 1.2em;">  • Windows の設定 → システム → ディスプレイ → 色のプロファイル → 「アプリの色を自動的に管理する」をオフにする</span>
<br/><span style="color: #00bfff; font-size: 1.2em;">  • またはグラフィックドライバの設定で HDR をオフにする</span>
<br/><br/><span style="font-size: 1.1em; color: #888;">ℹ️ タスクは続行されますが、認識の問題が発生する可能性があります</span>
