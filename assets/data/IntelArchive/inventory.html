<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>情报档案库</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{font-family:system-ui,-apple-system,sans-serif;background:#0f1117;color:#e0e0e0;padding:20px}
.header{display:flex;align-items:center;gap:16px;flex-wrap:wrap;margin-bottom:16px}
.header h1{font-size:20px;font-weight:600;color:#fff}
.header select,.toolbar button,.toolbar input{background:#1a1d28;color:#e0e0e0;border:1px solid #333;border-radius:6px;padding:6px 12px;font-size:14px}
.header select{cursor:pointer}
.toolbar{display:flex;align-items:center;gap:8px;flex-wrap:wrap;margin-bottom:20px}
.toolbar input{width:220px;outline:none}
.toolbar input:focus{border-color:#8ab4f8}
.toolbar input::placeholder{color:#777}
.toolbar button{cursor:pointer}
.toolbar button:hover{background:#232838}
.toolbar button.active{border-color:#8ab4f8;color:#8ab4f8}
.stats{display:flex;gap:12px;flex-wrap:wrap;margin-bottom:24px}
.stat-card{background:#1a1d28;border:1px solid #262a36;border-radius:8px;padding:12px 20px;min-width:120px}
.stat-card .label{font-size:12px;color:#888;margin-bottom:4px}
.stat-card .value{font-size:24px;font-weight:700}
.stat-card .value.total{color:#8ab4f8}
.stat-card .value.unlocked{color:#81c995}
.stat-card .value.locked{color:#f28b82}
.tree{display:flex;flex-direction:column;gap:10px}
.tree details{background:#161922;border:1px solid #262a36;border-radius:10px}
.tree summary{list-style:none;cursor:pointer;display:flex;align-items:center;justify-content:space-between;gap:12px;padding:12px 14px;user-select:none}
.tree summary::-webkit-details-marker{display:none}
.tree details.level-2{margin:10px 12px 12px 12px;background:#13161d}
.tree details.level-3{margin:8px 12px 10px 12px;background:#10131a}
.tree-body{padding:0 12px 12px 12px}
.tree-row{display:flex;align-items:center;gap:10px;min-width:0}
.caret{width:10px;height:10px;border-right:2px solid #8ab4f8;border-bottom:2px solid #8ab4f8;transform:rotate(-45deg);transition:transform .15s ease;flex-shrink:0}
details[open]>.tree-summary .caret{transform:rotate(45deg)}
.tree-label{font-size:15px;font-weight:600;color:#dce7ff}
.tree-subtitle{font-size:14px;font-weight:500;color:#c8d2e8}
.count{margin-left:auto;color:#9fb0c7;font-size:13px;flex-shrink:0}
.item-list{display:grid;grid-template-columns:repeat(auto-fill,260px);gap:8px;padding:8px 12px 12px 28px}
.item{width:260px;background:#1a1d28;border:1px solid #262a36;border-radius:8px;padding:8px 10px;display:flex;align-items:center;gap:8px;font-size:13px;min-width:0}
.item.unlocked{border-color:#2d4a3e}
.item.locked{opacity:.55}
.dot{width:8px;height:8px;border-radius:50%;flex-shrink:0}
.dot.on{background:#81c995}
.dot.off{background:#555}
.item-name{overflow:hidden;text-overflow:ellipsis;white-space:nowrap;min-width:0}
.empty-branch{padding:8px 12px 12px 28px;color:#777;font-size:13px}
.no-data{text-align:center;color:#888;padding:60px 0;font-size:16px}
</style>
</head>
<body>
<div class="header">
  <h1>情报档案库</h1>
  <select id="uid-select"></select>
</div>
<div class="stats" id="stats"></div>
<div class="toolbar">
  <input id="search-input" type="search" placeholder="搜索档案名称" autocomplete="off">
  <button type="button" data-filter="all" class="active">全部</button>
  <button type="button" data-filter="unlocked">仅已解锁</button>
  <button type="button" data-filter="locked">仅未解锁</button>
  <button type="button" id="expand-all">展开全部</button>
  <button type="button" id="collapse-all">收起全部</button>
</div>
<div id="content"></div>
<script>
var CATALOG = /*__CATALOG__*/;
var ITEMS = /*__ITEMS__*/;
var UNLOCKED = /*__UNLOCKED__*/;
var FILE_CATEGORY_ORDER = ['investigate', 'paper', 'digital', 'collection', 'media', 'document', 'report'];
var FILE_CATEGORY_LABELS = {
  investigate: '事件调查',
  paper: '纸质记录',
  digital: '电子档案',
  collection: '藏品',
  media: '多媒体',
  document: '中枢档案',
  report: '调查报告'
};

var uidSelect = document.getElementById('uid-select');
var statsEl = document.getElementById('stats');
var contentEl = document.getElementById('content');
var searchInput = document.getElementById('search-input');
var filterButtons = Array.prototype.slice.call(document.querySelectorAll('[data-filter]'));
var expandAllButton = document.getElementById('expand-all');
var collapseAllButton = document.getElementById('collapse-all');

var accounts = UNLOCKED.accounts || {};
var uids = Object.keys(accounts).sort();
if (uids.length === 0) uids = ['(none)'];
var currentFilter = 'all';
var currentQuery = '';

uids.forEach(function(uid) {
  var opt = document.createElement('option');
  opt.value = uid;
  opt.textContent = 'UID: ' + uid;
  uidSelect.appendChild(opt);
});

uidSelect.addEventListener('change', render);
searchInput.addEventListener('input', function() {
  currentQuery = searchInput.value || '';
  render();
});
filterButtons.forEach(function(btn) {
  btn.addEventListener('click', function() {
    currentFilter = btn.getAttribute('data-filter') || 'all';
    syncFilterButtons();
    render();
  });
});
expandAllButton.addEventListener('click', function() {
  setAllOpen(true);
});
collapseAllButton.addEventListener('click', function() {
  setAllOpen(false);
});
syncFilterButtons();
render();

function render() {
  var uid = uidSelect.value;
  var unlockedSet = {};
  var arr = (accounts[uid] && accounts[uid].unlocked) || [];
  arr.forEach(function(id) { unlockedSet[id] = true; });

  var allItems = ITEMS.items || {};
  var itemList = Object.values(allItems);
  var archiveList = itemList.filter(function(it) {
    return !isInvestigateItem(it);
  });
  var archiveRows = [];
  archiveList.forEach(function(it) {
    var pages = it.pages || [];
    if (pages.length > 1) {
      pages.forEach(function(page) {
        archiveRows.push(makeLeaf(it, page.id));
      });
      return;
    }
    archiveRows.push(it);
  });
  var totalCount = archiveRows.length;
  var unlockedCount = 0;
  archiveRows.forEach(function(row) { if (isUnlocked(row, unlockedSet)) unlockedCount++; });

  statsEl.innerHTML =
    '<div class="stat-card"><div class="label">总档案</div><div class="value total">' + totalCount + '</div></div>' +
    '<div class="stat-card"><div class="label">已解锁</div><div class="value unlocked">' + unlockedCount + '</div></div>' +
    '<div class="stat-card"><div class="label">未解锁</div><div class="value locked">' + (totalCount - unlockedCount) + '</div></div>';

  renderTree(buildTree(itemList, allItems, unlockedSet));
}

function buildTree(itemList, allItems, unlockedSet) {
  var categories = (CATALOG.categories || []).map(function(c) {
    return {
      id: c.id,
      name: c.name,
      groups: []
    };
  });
  var categoryMap = {};
  categories.forEach(function(category) {
    categoryMap[category.id] = category;
  });

  itemList.forEach(function(item) {
    if (isInvestigateItem(item)) return;
    var group = getOrCreateFileGroup(categoryMap, categories, item);
    var pages = item.pages || [];
    if (pages.length > 1) {
      pages.forEach(function(page) {
        group.items.push(makeLeaf(item, page.id));
      });
      return;
    }
    group.items.push(item);
  });

  appendInvestigateGroups(categoryMap, allItems);

  categories.forEach(function(category) {
    if (category.id !== 'investigate') {
      category.groups.sort(function(a, b) {
        return getFileCategoryOrder(a.id) - getFileCategoryOrder(b.id);
      });
    } else {
      category.groups.sort(function(a, b) {
        return getItemOrder(a.queryItem || a) - getItemOrder(b.queryItem || b);
      });
    }
    category.groups.forEach(function(group) {
      if (group.subgroups && group.subgroups.length) {
        group.subgroups.forEach(function(subgroup) {
          finalizeGroup(subgroup, unlockedSet);
        });
        group.subgroups = group.subgroups.filter(function(subgroup) {
          return subgroup.visibleCount > 0;
        });
        group.items = [];
        group.subgroups.forEach(function(subgroup) {
          group.items = group.items.concat(subgroup.items);
        });
        group.visibleItems = [];
        group.subgroups.forEach(function(subgroup) {
          group.visibleItems = group.visibleItems.concat(subgroup.visibleItems);
        });
        group.totalCount = 0;
        group.unlockedCount = 0;
        group.visibleCount = 0;
        group.subgroups.forEach(function(subgroup) {
          group.totalCount += subgroup.totalCount;
          group.unlockedCount += subgroup.unlockedCount;
          group.visibleCount += subgroup.visibleCount;
        });
        return;
      }
      if (!group.preserveOrder) {
        group.items.sort(function(a, b) {
          var orderCmp = getItemOrder(a) - getItemOrder(b);
          if (orderCmp !== 0) return orderCmp;
          return getPageOrder(a) - getPageOrder(b);
        });
      }
      finalizeGroup(group, unlockedSet);
    });
    category.groups = category.groups.filter(function(group) {
      return group.visibleCount > 0;
    });
    category.totalCount = 0;
    category.unlockedCount = 0;
    category.visibleCount = 0;
    category.groups.forEach(function(group) {
      category.totalCount += group.totalCount;
      category.unlockedCount += group.unlockedCount;
      category.visibleCount += group.visibleCount;
    });
  });

  return categories.filter(function(category) {
    return category.visibleCount > 0;
  });
}

function getOrCreateFileGroup(categoryMap, categories, item) {
  var categoryId = item.page || ((item.tagIds || [])[0]) || '_other';
  if (!categoryMap[categoryId]) {
    categoryMap[categoryId] = { id: categoryId, name: categoryId, groups: [] };
    categories.push(categoryMap[categoryId]);
  }
  var category = categoryMap[categoryId];
  var groupId = item.fileCategory || '_other';
  for (var i = 0; i < category.groups.length; i++) {
    if (category.groups[i].id === groupId) {
      return category.groups[i];
    }
  }
  var group = {
    id: groupId,
    name: FILE_CATEGORY_LABELS[groupId] || groupId,
    items: []
  };
  category.groups.push(group);
  return group;
}

function appendInvestigateGroups(categoryMap, allItems) {
  var category = categoryMap.investigate;
  if (!category) {
    category = { id: 'investigate', name: '情报采集', groups: [] };
    categoryMap.investigate = category;
  }
  Object.keys(allItems).forEach(function(id) {
    var inv = allItems[id];
    if (!isInvestigateItem(inv)) return;
    var subgroups = [];
    (inv.groups || []).forEach(function(rawGroup, idx) {
      subgroups.push({
        id: rawGroup.id || (inv.id + '_' + idx),
        name: getItemName(rawGroup) || ('问题 ' + (idx + 1)),
        items: resolveEntries(rawGroup.entries, allItems),
        preserveOrder: true,
        queryItem: inv,
        queryName: getItemName(rawGroup)
      });
    });
    var leaves = [];
    if (subgroups.length) {
      subgroups.forEach(function(subgroup) {
        leaves = leaves.concat(subgroup.items);
      });
    } else {
      (inv.relatedItemIds || []).forEach(function(relatedId) {
        var item = allItems[relatedId];
        if (item) leaves.push(makeLeaf(item, ''));
      });
    }
    category.groups.push({
      id: inv.id,
      name: getItemName(inv),
      items: leaves,
      subgroups: subgroups,
      preserveOrder: true,
      queryItem: inv
    });
  });
}

function resolveEntries(entries, allItems) {
  var leaves = [];
  (entries || []).forEach(function(entry) {
    var item = allItems[entry.itemId];
    if (item) leaves.push(makeLeaf(item, entry.pageId));
  });
  return leaves;
}

function makeLeaf(item, pageId) {
  return {
    item: item,
    displayName: getPageName(item, pageId),
    pageId: pageId || ''
  };
}

function getPageName(item, pageId) {
  if (!pageId) return getItemName(item);
  var pages = item.pages || [];
  for (var i = 0; i < pages.length; i++) {
    if (pages[i].id === pageId) {
      return getItemName(pages[i]) || getItemName(item);
    }
  }
  return getItemName(item);
}

function getItemOrder(value) {
  var item = unwrapLeaf(value);
  var order = item && item.order;
  return typeof order === 'number' ? order : 0;
}

function getPageOrder(value) {
  var item = unwrapLeaf(value);
  var pageId = value && value.pageId;
  if (!item || !pageId) return 0;
  var pages = item.pages || [];
  for (var i = 0; i < pages.length; i++) {
    if (pages[i].id === pageId) {
      return pages[i].order || (i + 1);
    }
  }
  return 0;
}

function unwrapLeaf(value) {
  return value && value.item ? value.item : value;
}

function finalizeGroup(group, unlockedSet) {
  group.visibleItems = (group.items || []).filter(function(item) {
    return matchesLeaf(group, item, unlockedSet);
  });
  group.totalCount = (group.items || []).length;
  group.unlockedCount = (group.items || []).filter(function(item) {
    return isUnlocked(item, unlockedSet);
  }).length;
  group.visibleCount = group.visibleItems.length;
}

function renderTree(tree) {
  contentEl.innerHTML = '';
  if (!tree.length) {
    contentEl.innerHTML = '<div class="no-data">' + (currentQuery.trim() ? '未找到匹配档案' : '当前筛选条件下暂无档案数据') + '</div>';
    return;
  }

  var root = document.createElement('div');
  root.className = 'tree';
  var state = getOpenState();
  var searching = currentQuery.trim() !== '';

  tree.forEach(function(category, categoryIndex) {
    var categoryKey = 'category:' + category.id;
    var categoryNode = createBranch({
      level: 1,
      key: categoryKey,
      label: category.name,
      count: category.unlockedCount + ' / ' + category.totalCount,
      defaultOpen: searching || categoryIndex === 0,
      forceOpen: searching,
      state: state
    });

    var categoryBody = categoryNode.querySelector('.tree-body');
    category.groups.forEach(function(group) {
      var groupKey = categoryKey + '/group:' + group.id;
      var groupNode = createBranch({
        level: 2,
        key: groupKey,
        label: group.name,
        count: group.unlockedCount + ' / ' + group.totalCount,
        defaultOpen: searching,
        forceOpen: searching,
        state: state
      });
      var groupBody = groupNode.querySelector('.tree-body');
      if (group.subgroups && group.subgroups.length) {
        group.subgroups.forEach(function(subgroup) {
          var subNode = createBranch({
            level: 3,
            key: groupKey + '/sub:' + subgroup.id,
            label: subgroup.name,
            count: subgroup.unlockedCount + ' / ' + subgroup.totalCount,
            defaultOpen: searching,
            forceOpen: searching,
            state: state
          });
          appendLeaves(subNode.querySelector('.tree-body'), subgroup.visibleItems, state.uidUnlockedSet);
          groupBody.appendChild(subNode);
        });
      } else {
        appendLeaves(groupBody, group.visibleItems, state.uidUnlockedSet);
      }
      categoryBody.appendChild(groupNode);
    });

    root.appendChild(categoryNode);
  });

  contentEl.appendChild(root);
}

function createBranch(config) {
  var details = document.createElement('details');
  details.className = 'level-' + (config.level || 1);
  details.dataset.key = config.key;
  details.open = config.forceOpen ? true : hasStoredOpenState(config.state, config.key, config.defaultOpen);

  var summary = document.createElement('summary');
  summary.className = 'tree-summary';
  summary.innerHTML =
    '<div class="tree-row">' +
      '<span class="caret"></span>' +
      '<span class="' + (config.level === 1 ? 'tree-label' : 'tree-subtitle') + '">' + escapeHtml(config.label) + '</span>' +
    '</div>' +
    '<span class="count">' + escapeHtml(config.count) + '</span>';
  details.appendChild(summary);

  var body = document.createElement('div');
  body.className = 'tree-body';
  details.appendChild(body);

  details.addEventListener('toggle', function() {
    if (currentQuery.trim()) return;
    saveOpenState(config.key, details.open);
  });

  return details;
}

function appendLeaves(parent, leaves, unlockedSet) {
  if (!leaves || !leaves.length) {
    var empty = document.createElement('div');
    empty.className = 'empty-branch';
    empty.textContent = '当前筛选下无条目';
    parent.appendChild(empty);
    return;
  }
  var itemList = document.createElement('div');
  itemList.className = 'item-list';
  leaves.forEach(function(leaf) {
    itemList.appendChild(createItem(leaf, unlockedSet));
  });
  parent.appendChild(itemList);
}

function createItem(value, unlockedSet) {
  var item = unwrapLeaf(value);
  var name = (value && value.displayName) || getItemName(item);
  var unlocked = isUnlocked(value, unlockedSet);
  var node = document.createElement('div');
  node.className = 'item ' + (unlocked ? 'unlocked' : 'locked');
  node.title = name;
  node.innerHTML =
    '<span class="dot ' + (unlocked ? 'on' : 'off') + '"></span>' +
    '<span class="item-name">' + escapeHtml(name) + '</span>';
  return node;
}

function getItemName(item) {
  return (item.names && (item.names.zh_cn || item.names.zh_tw || item.names.en_us)) || item.id;
}

function isInvestigateItem(item) {
  return !!item && (item.page === 'investigate' || item.fileCategory === 'investigate');
}

function isUnlocked(value, unlockedSet) {
  if (!value || !unlockedSet) return false;
  var pageId = value.pageId || '';
  var item = unwrapLeaf(value);
  if (!item) return false;
  if (pageId) return !!unlockedSet[pageId];
  var pages = item.pages || [];
  if (pages.length === 1 && pages[0].id) {
    return !!unlockedSet[pages[0].id];
  }
  if (pages.length > 1) {
    return false;
  }
  if (unlockedSet[item.id]) return true;
  var related = item.relatedItemIds || [];
  if (!related.length) return false;
  return related.every(function(id) {
    return !!unlockedSet[id];
  });
}

function matchesLeaf(group, value, unlockedSet) {
  var item = unwrapLeaf(value);
  var displayName = (value && value.displayName) || getItemName(item);
  if (!matchesFilter(value, unlockedSet)) return false;
  if (group && group.queryItem && matchesQuery(group.queryItem)) return true;
  if (group && group.queryName && matchesText(group.queryName)) return true;
  return matchesQuery(item) || matchesText(displayName);
}

function matchesText(text) {
  var q = currentQuery.trim().toLowerCase();
  if (!q) return true;
  return String(text).toLowerCase().indexOf(q) !== -1;
}

function matchesQuery(item) {
  var q = currentQuery.trim().toLowerCase();
  if (!q) return true;
  if (String(item.id).toLowerCase().indexOf(q) !== -1) return true;
  var names = item.names || {};
  return Object.keys(names).some(function(lang) {
    return String(names[lang]).toLowerCase().indexOf(q) !== -1;
  });
}

function matchesFilter(value, unlockedSet) {
  var unlocked = isUnlocked(value, unlockedSet);
  if (currentFilter === 'unlocked') return unlocked;
  if (currentFilter === 'locked') return !unlocked;
  return true;
}

function getFileCategoryOrder(categoryId) {
  var index = FILE_CATEGORY_ORDER.indexOf(categoryId);
  return index === -1 ? FILE_CATEGORY_ORDER.length + 1 : index;
}

function syncFilterButtons() {
  filterButtons.forEach(function(btn) {
    var active = btn.getAttribute('data-filter') === currentFilter;
    btn.classList.toggle('active', active);
  });
}

function getStorageKey() {
  return 'intel-archive-tree:' + uidSelect.value;
}

function getOpenState() {
  var raw = sessionStorage.getItem(getStorageKey());
  var openMap = {};
  if (raw) {
    try {
      openMap = JSON.parse(raw) || {};
    } catch (err) {
      openMap = {};
    }
  }
  var unlockedSet = {};
  var arr = (accounts[uidSelect.value] && accounts[uidSelect.value].unlocked) || [];
  arr.forEach(function(id) { unlockedSet[id] = true; });
  return {
    openMap: openMap,
    uidUnlockedSet: unlockedSet
  };
}

function hasStoredOpenState(state, key, defaultOpen) {
  if (Object.prototype.hasOwnProperty.call(state.openMap, key)) {
    return !!state.openMap[key];
  }
  return defaultOpen;
}

function saveOpenState(key, value) {
  var state = getOpenState();
  state.openMap[key] = value;
  sessionStorage.setItem(getStorageKey(), JSON.stringify(state.openMap));
}

function setAllOpen(open) {
  var nodes = contentEl.querySelectorAll('details[data-key]');
  nodes.forEach(function(node) {
    node.open = open;
  });
}

function escapeHtml(text) {
  return String(text)
    .replace(/&/g, '&amp;')
    .replace(/</g, '&lt;')
    .replace(/>/g, '&gt;')
    .replace(/"/g, '&quot;')
    .replace(/'/g, '&#39;');
}
</script>
</body>
</html>
