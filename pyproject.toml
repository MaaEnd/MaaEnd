[project]
name = "maaend"
version = "0.0.0"
description = "Python dependencies for MaaEnd development scripts"
requires-python = ">=3.14"
# zmdmap 的 CLI 用 click、下载数据用 httpx；放核心依赖是为了让 CI 能
# `uv run --no-default-groups zmdmap` 只装这两个包就出数据，不必拉 scripts 组里的 maafw / fastapi / numpy。
dependencies = ["click>=8.1", "httpx>=0.28"]

[project.scripts]
autocollect-route = "tools.AutoCollectRoute.main:main"
build-and-install = "tools.setup.build_and_install:main"
map-navigator = "tools.MapNavigator.main:main"
sentry-report = "tools.sentry.cli:main"
setup-workspace = "tools.setup.setup_workspace:main"
zmdmap = "tools.zmdmap.cli:main"

[build-system]
requires = ["uv_build>=0.13.1,<0.14"]
build-backend = "uv_build"

[dependency-groups]
schema = ["jsonschema>=4.26", "referencing>=0.37"]
pipeline = ["json5>=0.17", "maafw>=5.12"]
images = ["numpy>=2.5", "pillow>=13.0", "tqdm>=4.70"]
map-navigator = [
    "fastapi>=0.129",
    "maafw>=5.13.0b4",
    "numpy>=2.5",
    "pydantic>=2.14",
    "pynput>=1.7.0",
    "pyperclip>=1.11",
    "starlette>=1.9",
    "uvicorn>=0.41",
    "websockets>=17.2",
]
scripts = [
    { include-group = "schema" },
    { include-group = "pipeline" },
    { include-group = "images" },
    { include-group = "map-navigator" },
]
optimize-templates = [
    "numpy>=2.5.4",
    "pillow>=13.0.0",
    "tqdm>=4.70.1",
]

[tool.uv]
default-groups = ["scripts"]
package = true

[tool.uv.build-backend]
module-name = ["tools.AutoCollectRoute", "tools.MapNavigator", "tools.sentry", "tools.setup", "tools.zmdmap"]
module-root = ""
